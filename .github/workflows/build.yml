name: Build Debug APK and Upload to Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use run number)'
        required: false
        type: string
  push:
    tags:
      - 'v*'   # 推送 v1.0.0 等标签时自动触发

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码（包含子模块）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. 设置 Android SDK（安装 Platform 37, Build Tools 36.0.0, NDK, CMake）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '29.0.13113456'
          cmake-version: '3.22.1'
          packages: |
            platforms;android-37
            build-tools;36.0.0

      # 4. 缓存 Gradle 依赖（加速构建）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. （可选）创建空的 server.properties，避免构建时因缺少配置报错
      #    如果项目必须需要真实配置，请改为复制 server.properties.example 并填入 Secrets
      - name: Ensure server.properties exists
        run: |
          if [ ! -f server.properties ]; then
            cp server.properties.example server.properties 2>/dev/null || touch server.properties
          fi

      # 6. 构建 Debug APK
      - name: Build Debug APK
        run: |
          ./gradlew :manager:assembleDebug --no-daemon --stacktrace

      # 7. 定位并整理 APK 产物
      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find manager/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          mkdir -p out
          cp "$APK_PATH" "out/yuehong-privilege-assistant-debug.apk"
          echo "apk_path=out/yuehong-privilege-assistant-debug.apk" >> $GITHUB_OUTPUT

      # 8. 上传到 Release
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || format('debug-build-{0}', github.run_number) }}
          name: ${{ format('Debug Build {0}', github.run_number) }}
          body: |
            Automatic debug build from commit ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
