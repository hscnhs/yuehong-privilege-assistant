name: Build Debug APK and Upload to Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use run number)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 使用 v4，并显式跳过默认的 platform-tools 安装
      - name: Set up Android SDK base
        uses: android-actions/setup-android@v4
        with:
          packages: ''  # 关键：不让 action 内部安装任何包

      # 诊断：先列出所有可用的 SDK 包，确认 android-37 的正确标识符
      - name: List available SDK packages
        run: |
          sdkmanager --list 2>&1 | tee sdkmanager-list.txt
          echo "---- 包含 android-37 的行 ----"
          grep -i "android-37" sdkmanager-list.txt || echo "❌ 列表中未找到 android-37 相关包"

      # 手动安装（使用诊断结果中确认的包名，这里暂用 android-37）
      - name: Install SDK packages manually
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.22.1"

          # 如果实际安装的是 android-37.0，创建符号链接
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ]; then
            ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

      - name: Configure local.properties
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure server.properties exists
        run: |
          if [ ! -f server.properties ]; then
            cp server.properties.example server.properties 2>/dev/null || touch server.properties
          fi

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :manager:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find manager/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          mkdir -p out
          cp "$APK_PATH" out/yuehong-privilege-assistant-debug.apk
          echo "apk_path=out/yuehong-privilege-assistant-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: out/yuehong-privilege-assistant-debug.apk
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || format('debug-build-{0}', github.run_number) }}
          name: ${{ format('Debug Build {0}', github.run_number) }}
          body: |
            Automatic debug build from commit ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
