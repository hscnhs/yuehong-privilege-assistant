name: Build Debug APK and Upload to Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use run number)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 只初始化环境，不装任何包
      - name: Set up Android SDK base
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 手动安装 API 36 相关组件（stable channel，无需符号链接）
      - name: Install SDK packages (API 36)
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.22.1"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

          echo "---- 已安装 platforms ----"
          ls "$SDK_ROOT/platforms" || true

      - name: Configure local.properties
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure server.properties exists
        run: |
          if [ ! -f server.properties ]; then
            cp server.properties.example server.properties 2>/dev/null || touch server.properties
          fi

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :manager:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find manager/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found"
            find manager/build/outputs -type f || true
            exit 1
          fi
          mkdir -p out
          cp "$APK_PATH" out/yuehong-privilege-assistant-debug.apk
          echo "apk_path=out/yuehong-privilege-assistant-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: out/yuehong-privilege-assistant-debug.apk
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || format('debug-build-{0}', github.run_number) }}
          name: ${{ format('Debug Build {0}', github.run_number) }}
          body: |
            Automatic debug build from commit ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
