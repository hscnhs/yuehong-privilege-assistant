name: Build Debug APK and Upload to Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use run number)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码（含子模块）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. 初始化 Android SDK 基础环境（不指定 packages，避免包名解析失败）
      - name: Set up Android SDK base
        uses: android-actions/setup-android@v3

      # 4. 手动安装 SDK 组件，并创建 android-37 符号链接
      - name: Install SDK packages manually
        run: |
          set -e
          # 接受所有许可
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # 安装 Platform 37.0、Build Tools 36.0.0、平台工具、NDK、CMake
          # 注意：platforms 的正确标识符是 android-37.0（不是 android-37）
          sdkmanager --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.13113456" \
            "cmake;3.22.1"

          # 关键：AGP 默认查找 platforms/android-37，这里创建符号链接指向 android-37.0
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

          echo "---- platforms 目录 ----"
          ls -la "$SDK_ROOT/platforms" || true
          echo "---- ndk 目录 ----"
          ls -la "$SDK_ROOT/ndk" || true
          echo "---- cmake 目录 ----"
          ls -la "$SDK_ROOT/cmake" || true

      # 5. 写入 local.properties，确保 Gradle 找到 SDK
      - name: Configure local.properties
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      # 6. Gradle 缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. 确保 server.properties 存在（缺失时用示例或空文件兜底）
      - name: Ensure server.properties exists
        run: |
          if [ ! -f server.properties ]; then
            if [ -f server.properties.example ]; then
              cp server.properties.example server.properties
              echo "✅ 使用 server.properties.example 作为兜底"
            else
              touch server.properties
              echo "⚠️ 未找到示例配置，已创建空 server.properties"
            fi
          else
            echo "✅ server.properties 已存在"
          fi

      # 8. 构建 Debug APK
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :manager:assembleDebug --no-daemon --stacktrace

      # 9. 定位并整理 APK
      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find manager/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到 APK 产物，列出目录内容："
            find manager/build/outputs -type f || true
            exit 1
          fi
          mkdir -p out
          cp "$APK_PATH" out/yuehong-privilege-assistant-debug.apk
          echo "apk_path=out/yuehong-privilege-assistant-debug.apk" >> $GITHUB_OUTPUT
          echo "✅ APK: $APK_PATH"

      # 10. 上传构建产物（便于排查）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: out/yuehong-privilege-assistant-debug.apk
          retention-days: 7

      # 11. 发布到 Release
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || format('debug-build-{0}', github.run_number) }}
          name: ${{ format('Debug Build {0}', github.run_number) }}
          body: |
            Automatic debug build from commit ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
